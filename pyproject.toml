[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev27b-mlx"
version = "1.0.0"
description = "AutoTrust-JEV-27B v1.1 on Apple Silicon (MLX): one-pass decisions with bidirectional prompt attention"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "Paris Michalas, NetProjects (Internet Projects Ltd)"}]
dependencies = ["mlx>=0.32", "mlx-vlm>=0.7.6", "transformers>=5.17", "huggingface_hub", "numpy"]

[project.urls]
Homepage = "https://github.com/internet-projects/autotrust-jev27b-mlx"
Weights = "https://huggingface.co/netprojects"

[tool.setuptools]
packages = ["jev27b_mlx"]
